name: Build BridgeMart Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Type de compilation APK'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - split-per-abi

permissions:
  contents: write

jobs:
  build:
    name: Compilation Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Cloner le référentiel
        uses: actions/checkout@v4

      - name: 2. Installer Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Installer Flutter SDK (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Vérifier l'environnement Flutter
        run: flutter doctor -v

      - name: 5. Préparer l'environnement Android & Dépendances
        run: |
          mkdir -p assets/images
          rm -rf android
          flutter create --platforms=android --org com.bridgemart --project-name naijabenin_tissus_app .
          python3 scripts/prepare_android.py
          flutter pub get

      - name: 6. Compiler l'APK Android (Release Universel)
        run: |
          set -o pipefail
          if ! flutter build apk --release --no-tree-shake-icons 2>&1 | tee build_log.txt; then
            echo "### ❌ Erreur lors de la compilation de l'APK :" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build_log.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/BridgeMart-v1.0.0-Universal.apk

          echo "--- Double Signature v1 (JAR) + v2 + v3 pour Compatibilité Universelle Android ---"
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=BridgeMart,O=BridgeMart,C=BJ"
          fi

          # Signature universelle v1 (JAR) + v2 + v3 avec apksigner
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Utilisation de apksigner : $APKSIGNER"

          $APKSIGNER sign --ks ~/.android/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --min-sdk-version 21 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true build/app/outputs/flutter-apk/BridgeMart-v1.0.0-Universal.apk

          echo "Vérification complète de la signature de l'APK :"
          $APKSIGNER verify --verbose build/app/outputs/flutter-apk/BridgeMart-v1.0.0-Universal.apk

      - name: 7. Compiler les APKs optimisés par architecture (Arm64 / Armeabi)
        if: "${{ github.event.inputs.build_type == 'split-per-abi' }}"
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: 8. Publier l'APK comme Artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: BridgeMart-Android-APK
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: 9. Publier la Release GitHub Publique (Téléchargement direct sans compte requis)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "BridgeMart v1.0.0 — Application Android Universelle"
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/BridgeMart-v1.0.0-Universal.apk
          body: |
            ## 📱 BridgeMart — Marketplace de Tissus Nigeria 🇳🇬 ⇄ Bénin 🇧🇯

            L'application mobile officielle BridgeMart v1.0.0 est prête pour installation sur tout smartphone Android.

            ### ⬇️ Téléchargement Direct de l'APK (Sans compte GitHub requis) :
            👉 **[Télécharger BridgeMart-v1.0.0-Universal.apk](https://github.com/Greg680-dot/bridgemart-app/releases/download/v1.0.0/BridgeMart-v1.0.0-Universal.apk)**

            ---
            ### 🌟 Nouvelles fonctionnalités intégrées :
            - **Double signature v1 (JAR) + v2 + v3** garantissant l'installation sur tous les smartphones (Infinix, Tecno, Xiaomi, Samsung, etc.).
            - **Splash Screen animé Alibaba/Jumia** au démarrage avec barre de progression temps réel.
            - **Guichet Dantokpa (Cotonou)** : Scanner de QR code, saisie OTP 6 chiffres (`749-382`) et déblocage irréversible du séquestre vers le vendeur nigérian.
            - **Architecture 4 rôles automatique** (Acheteur béninois, Vendeur nigérian, Agent guichetier, Super Administrateur).
            - **Passerelle "Devenir Vendeur"** : Création de boutique et validation obligatoire par le Super Admin avant publication des articles.
            - **Galerie multi-photos** des tissus avec carrousel et zoom interactif.
            - **Séquestre Mobile Money (Kkiapay MTN/Moov/Celtiis)** & Virements NGN bancaires (GTBank, Access Bank, Zenith).

      - name: 10. Afficher le récapitulatif de compilation
        run: |
          echo "### 🚀 Compilation BridgeMart APK Réussie !" >> $GITHUB_STEP_SUMMARY
          echo "L'APK universel d'installation est disponible en téléchargement direct :" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Publique :** https://github.com/Greg680-dot/bridgemart-app/releases/tag/v1.0.0" >> $GITHUB_STEP_SUMMARY
          echo "- **Fichier :** \`BridgeMart-v1.0.0-Universal.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Signatures :** v1 (JAR Scheme) + v2 + v3 vérifiées (100% compatible)" >> $GITHUB_STEP_SUMMARY
          echo "- **Environnement :** Android 5.0+ (API 21 à 34)" >> $GITHUB_STEP_SUMMARY
          echo "- **Version :** v1.0.0 (Build 1)" >> $GITHUB_STEP_SUMMARY
