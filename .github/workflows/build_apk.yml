name: Build BridgeMart Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Type de compilation APK'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - split-per-abi

jobs:
  build:
    name: Compilation Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Cloner le référentiel
        uses: actions/checkout@v4

      - name: 2. Installer Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Installer Flutter SDK (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Vérifier l'environnement Flutter
        run: flutter doctor -v

      - name: 5. Préparer l'environnement Android & Dépendances
        run: |
          mkdir -p assets/images
          rm -rf android
          flutter create --platforms=android --org com.bridgemart --project-name naijabenin_tissus_app .
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.CAMERA"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="naijabenin_tissus_app"/android:label="BridgeMart"/' android/app/src/main/AndroidManifest.xml
          flutter pub get

      - name: 6. Compiler l'APK Android (Release Universel)
        run: |
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/BridgeMart-v1.0.0-Universal.apk

      - name: 7. Compiler les APKs optimisés par architecture (Arm64 / Armeabi)
        if: "${{ github.event.inputs.build_type == 'split-per-abi' }}"
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: 8. Publier l'APK comme Artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: BridgeMart-Android-APK
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: 9. Afficher le récapitulatif de compilation
        run: |
          echo "### 🚀 Compilation BridgeMart APK Réussie !" >> $GITHUB_STEP_SUMMARY
          echo "L'APK universel d'installation est disponible dans les artefacts de ce workflow :" >> $GITHUB_STEP_SUMMARY
          echo "- **Fichier :** \`BridgeMart-v1.0.0-Universal.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Environnement :** Android 5.0+ (API 21 à 34)" >> $GITHUB_STEP_SUMMARY
          echo "- **Version :** v1.0.0 (Build 1)" >> $GITHUB_STEP_SUMMARY
